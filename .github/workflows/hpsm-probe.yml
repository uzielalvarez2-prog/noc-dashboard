# Prueba temporal: ¿se alcanza HPSM desde una IP de datacenter (nube)?
# El veredicto se lee en las conclusiones de los pasos (API pública):
#   alcanzable  -> conexión TCP/TLS llegó y hubo respuesta HTTP (con -k)
#   http-ok     -> la respuesta fue 2xx/3xx
#   tls-estricto-> el certificado valida sin -k (si falla, Playwright puede ignorarlo)
# Se borra después de obtener el resultado.
name: hpsm-probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hpsm-probe.yml"

env:
  URL: "https://sm.cnoc.telmexit.com/sm/index.do?lang=en"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: alcanzable
        run: curl -sSk -o /dev/null --max-time 30 -w "http=%{http_code} total=%{time_total}s\n" "$URL"
      - name: http-ok
        run: |
          code=$(curl -sSk -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "http=$code"
          [ "$code" -ge 200 ] && [ "$code" -lt 400 ]
      - name: tls-estricto
        run: curl -sS -o /dev/null --max-time 30 "$URL"
