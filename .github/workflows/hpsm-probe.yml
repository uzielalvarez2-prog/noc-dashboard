# Prueba temporal: ¿se alcanza HPSM desde una IP de datacenter (nube)?
# Se borra después de obtener el resultado.
name: hpsm-probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hpsm-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: IP publica del runner
        run: |
          echo "runner_ip=$(curl -s --max-time 10 https://api.ipify.org || echo desconocida)"
      - name: Probe HPSM
        run: |
          URL="https://sm.cnoc.telmexit.com/sm/index.do?lang=en"
          echo "== intento 1: normal =="
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL"); rc=$?
          echo "RESULT_NORMAL rc=$rc http=$code"
          echo "== intento 2: sin validar cert (distingue TLS vs bloqueo) =="
          code=$(curl -sSk -o /dev/null -w "%{http_code}" --max-time 30 "$URL"); rc=$?
          echo "RESULT_INSECURE rc=$rc http=$code"
          echo "== headers =="
          curl -sSkI --max-time 30 "$URL" | head -15 || true
          echo "== timing/verbose resumido =="
          curl -sSk -o /dev/null --max-time 30 -w "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" "$URL" || true
          exit 0
